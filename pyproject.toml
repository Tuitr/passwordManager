[project]
name = "password-manager"
version = "1.0.0"
description = "Консольный менеджер паролей с мастер-паролем и шифрованием записей"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=44",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle: стиль PEP 8
    "W",   # pycodestyle: предупреждения
    "F",   # pyflakes: неиспользуемые импорты, неизвестные имена
    "I",   # isort: порядок импортов
    "N",   # pep8-naming: имена в snake_case
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]